[package]
name = "infected_grounds"
version = "0.1.0"
edition = "2024"
description = "The Infected Grounds — version native (Bevy) pour Steam"
license = "MIT"

[dependencies]
bevy = "0.20"
# Steam (succès, amis, lobbys, anti-triche VAC…) : cargo build --release --features steam ; nécessite steam_api64.dll / libsteam_api.so à côté de l'exécutable
steamworks = { version = "0.13", optional = true }

[features]
steam = ["dep:steamworks"]

# compilation plus rapide en développement : le jeu en opt 1, toutes les dépendances (Bevy, wgpu…) en opt 3
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
