const MOBILE=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
// Qualité graphique : résolution interne du canvas (1x = 960 px de large ... 8x = 7680 px, soit 8K). « Auto » suit la résolution réelle de l'écran et se réduit seule si le jeu rame.
const GFX=[{id:'auto',n:'AUTO'},{id:'std',n:'STANDARD',r:1},{id:'high',n:'HAUTE',r:2},{id:'ultra',n:'ULTRA',r:3},{id:'4k',n:'4K',r:4},{id:'8k',n:'8K',r:8}];
let autoCap=MOBILE?2:4,RES=1,RESd=0;
function resWanted(vw){
  let g='auto';try{g=SET.gfx||'auto'}catch(e){}
  const q=GFX.find(x=>x.id===g)||GFX[0];
  let r=q.r||Math.max(1,Math.min(autoCap,Math.max(MOBILE?1.5:2,(vw*(window.devicePixelRatio||1))/W)));   // Auto : au moins 2x (suréchantillonnage), jusqu'à la résolution réelle de l'écran
  const maxA=MOBILE?16e6:36e6;                                       // limite de surface des navigateurs
  while(r>1&&W*H*r*r>maxA) r-=.25;
  return Math.round(r*4)/4;
}
let W=960,H=540,GROUND=460;const GRAV=0.7;   // coordonnées logiques : s'adaptent au format de l'écran (voir fit) ; le canvas fait 2x ces valeurs
cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);ctx=cv.getContext('2d');ctx.scale(RES,RES);
const GAME_VERSION='0.42';   // +0.01 à chaque mise à jour
var READY=false,FORCED=false,CW=1,CH=1;
// Le jeu s'adapte au format de l'écran (de 6:5 à 3:1) : la zone de jeu s'élargit (ou s'agrandit en hauteur) pour remplir tout l'écran, sans bandes noires.
const SAFE={l:0,r:0};
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('safe')),k=W/Math.max(1,cv.getBoundingClientRect().width);SAFE.l=(parseFloat(cs.paddingLeft)||0)*k;SAFE.r=(parseFloat(cs.paddingRight)||0)*k}catch(e){}
}
function fit(){
  const vv=window.visualViewport;let vw=Math.max(1,vv?vv.width:innerWidth),vh=Math.max(1,vv?vv.height:innerHeight);
  FORCED=READY&&vh>vw*1.02&&touchOn();                      // téléphone tenu en portrait : le jeu est pivoté de 90° pour rester en paysage, même avec le verrouillage de rotation
  if(FORCED){const t=vw;vw=vh;vh=t}
  const asp=vw/vh,a=Math.max(1.2,Math.min(3,asp));
  let nw,nh;if(a>=16/9){nh=540;nw=Math.round(540*a)}else{nw=960;nh=Math.round(960/a)}
  const rw=resWanted(vw);
  if(nw!==W||nh!==H||rw!==RESd){
    RES=RESd=rw;
    const dG=(nh-80)-GROUND;
    W=nw;H=nh;GROUND=nh-80;
    cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);cv.getContext('2d').setTransform(RES,0,0,RES,0,0);cv.getContext('2d').imageSmoothingQuality='high';
    if(READY&&dG){try{for(const z of zombies) z.y+=dG;for(const c of crates) c.y+=dG;player.y+=dG}catch(e){}}
  }
  const cw=asp>=1.2&&asp<=3?vw:(asp>3?vh*3:vw),ch=asp>=1.2&&asp<=3?vh:(asp>3?vh:vw/1.2);
  cv.style.width=cw+'px';cv.style.height=ch+'px';CW=cw;CH=ch;cv.style.transform=FORCED?'rotate(90deg)':'';cv.style.flex='none';
  if(READY){if(FORCED){SAFE.l=SAFE.r=0}else readSafe();layoutTouch();updateRot()}
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));if(window.visualViewport) visualViewport.addEventListener('resize',fit);fit();

}

  let c=HC.get(t);if(c!==undefined) return c;
  const v=DICT[LANG].get(t.toLowerCase());let r=t;
  if(v!==undefined) r=(t===t.toUpperCase()&&t!==t.toLowerCase())?v.toUpperCase():v;
  HC.set(t,r);return r;
}
{
  const P=CanvasRenderingContext2D.prototype,_ft=P.fillText,_mt=P.measureText;
  P.fillText=function(t,x,y,mw){
    t=trHook(t);
    if(mw===undefined&&LANG!=='fr'&&typeof t==='string'){            // un texte traduit plus long que prévu est comprimé au lieu de sortir de l'écran
      const al=this.textAlign;let av=al==='right'||al==='end'?x-8:al==='center'?2*Math.min(x,W-x)-16:W-8-x;
      if(av>40) mw=av;
    }
    return mw===undefined?_ft.call(this,t,x,y):_ft.call(this,t,x,y,mw);
  };
  P.measureText=function(t){return _mt.call(this,trHook(t))};
}

  if(m[c]) return m[c];
  if(/^Key[A-Z]$/.test(c)) return c.slice(3);
  if(/^Digit\d$/.test(c)) return c.slice(5);
  if(/^Numpad/.test(c)) return tr('Pavé').toUpperCase()+' '+c.slice(6);

const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
function shoot(){
  const wp=WEAPONS[player.w];let hw=wp,side=0;
  if(wp.hands){side=player.hand=1-(player.hand||0);hw=WEAPONS[wp.hi[side]];player[side?'muz1':'muz0']=70}   // akimbo : une main puis l'autre
  const px=player.x, py=player.y-48+(wp.hands?(side?5:-3):0);
  const base=aimDir()?(player.face>0?0:Math.PI):Math.atan2(mouse.y-py,mouse.x+camX-px);
  const sh=hw.kind==='shotgun';
  for(let i=0;i<hw.pellets;i++){
    // fusil à pompe : gerbe de plombs en cloche (la plupart près de l'axe, quelques-uns plus écartés) ; autres armes : dispersion uniforme
    const a=sh?base+Math.max(-hw.spread*.5,Math.min(hw.spread*.5,gauss()*hw.spread*.2)):base+(Math.random()-.5)*hw.spread*2;
    const sp=hw.speed*(sh?.93+Math.random()*.14:1),life=hw.life||Math.ceil(hw.range/sp);
    bullets.push({x:px+Math.cos(base)*22,y:py+Math.sin(base)*22,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sp,dist:0,range:hw.range,fall:sh,
      dmg:hw.dmg*player.dmgMul*wBoost(player.w)*(fxB.dmg>0?2:1),pierce:hw.pierce,life,l0:life,hit:new Set(),
      col:hw.col||'#ff0',aoe:hw.aoe||0,fire:!!hw.fire,size:hw.size||2});
  }
  if(['pistol','revolver','deagle','smg','ak','m4','lmg','dmr','barrett','minigun','shotgun'].includes(hw.kind)&&hw.kind!=='revolver'&&!hw.fire) particles.push({x:px,y:py-2,vx:-player.face*(1+Math.random()*1.8),vy:-2-Math.random()*2.2,life:90,ml:90,shell:true,rot:0,g:.32,col:hw.kind==='shotgun'?'#c9372c':'#d9b34a'});
  player.cd=(wp.hands?hw.rate*.6:wp.rate)/(fxB.rapid>0?1.8:1); player.firedThisClick=true;
  playGun(hw);
}
function slash(){
  const wp=WEAPONS[player.w];
  player.cd=wp.rate/(fxB.rapid>0?1.8:1); player.swing=180;
  playSwing(wp);let hitAny=false;
  for(const z of zombies){
    if(z.hp<=0||z.emerge>0) continue;
    const dx=(z.x-player.x)*player.face;
    if(dx>-10 && dx<wp.reach+14*z.size){
      z.hp-=wp.dmg*player.dmgMul*wBoost(player.w)*(fxB.dmg>0?2:1); z.x+=player.face*22/z.size; burst(z.x,z.y-40,'#a22',6);hitAny=true;
    }
  }
  if(hitAny&&snd()){const tt=AC.currentTime;if(!lastSfx.mh||tt-lastSfx.mh>.06){lastSfx.mh=tt;meleeHit(wp.name,tt)}}
}

// --- Bonus tombés des zombies : ramassés en marchant dessus (soin, bouclier, dégâts x2, cadence, gel, frappe aérienne, tourelle, butin) ---
const BON={
  heal:{n:'SOIN',c:'#c9372c',w:3},
  shield:{n:'BOUCLIER',c:'#3f8fe0',w:2,dur:8000},
  dmg:{n:'DÉGÂTS ×2',c:'#e0762a',w:2,dur:12000},
  rapid:{n:'CADENCE',c:'#d8b81f',w:2,dur:12000},
  freeze:{n:'GEL',c:'#5fc8e0',w:2,dur:8000},
  strike:{n:'FRAPPE AÉRIENNE',c:'#a83a2a',w:1.5},
  turret:{n:'TOURELLE',c:'#6f8560',w:1.5,dur:14000},
  cash:{n:'BUTIN +10 $',c:'#d8a020',w:2}
};
let bonuses=[],strikes=[],turret=null,fxB={shield:0,dmg:0,rapid:0,freeze:0};
function dropBonus(z){
  const ch=(z.type==='tank'?.3:z.type==='fast'?.09:.06)*curMap.drop;
  if(Math.random()>=ch) return;
  const ks=Object.keys(BON).filter(k=>!(training&&k==='cash')),low=player.hp<player.maxhp*.5;
  let tot=0;const ws=ks.map(k=>{const w=BON[k].w*(k==='heal'&&low?2.5:1);tot+=w;return w});
  let r=Math.random()*tot,i=0;while(i<ks.length-1&&(r-=ws[i])>0) i++;
  bonuses.push({x:Math.max(30,Math.min(WORLD_W-30,z.x)),y:z.y-70,vy:-4,type:ks[i],life:12000});
}
function applyBonus(type){
  const p=player,B=BON[type];
  if(type==='heal') p.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*.35));
  else if(type==='cash'){if(!training) addMoney(10)}
  else if(type==='strike'){for(let i=0;i<6;i++) strikes.push({x:camX+60+Math.random()*(W-120),t:-i*230-200,w:false})}
  else if(type==='turret') turret={x:p.x,t:B.dur,cd:0};
  else fxB[type]=B.dur;
  sfx('bonus');flash(B.n);burst(p.x,p.y-40,B.c,14);
}
function updateBonus(dt){
  const p=player;
  for(const k in fxB) if(fxB[k]>0) fxB[k]=Math.max(0,fxB[k]-dt);
  for(const b of bonuses){
    b.life-=dt;b.vy+=.35;b.y+=b.vy;if(b.y>GROUND-16){b.y=GROUND-16;b.vy=0}
    if(Math.abs(b.x-p.x)<28&&p.y>GROUND-70){applyBonus(b.type);b.life=0}
  }
  bonuses=bonuses.filter(b=>b.life>0);
  if(turret){
    turret.t-=dt;turret.cd-=dt;
    if(turret.cd<=0){
      let best=null,bd=520;for(const z of zombies){if(z.hp<=0||z.emerge>0) continue;const d=Math.abs(z.x-turret.x);if(d<bd){bd=d;best=z}}

function update(dt){

  if(mv) p.step+=0.25*Math.abs(mv);
  if(kd('jump') && p.y>=GROUND) p.vy=-13;
  p.vy+=GRAV; p.y+=p.vy; if(p.y>GROUND){p.y=GROUND;p.vy=0}
  updateCam(false);

  updateCrates(dt,p);

  if(spawnQueue.length && spawnTimer<=0 && !(spawnQueue.length===1&&spawnQueue[0]==='digger'&&zombies.length>0)){   // le fouisseur attend que tous les autres soient morts
    spawnZombie(spawnQueue.pop());
    spawnTimer=Math.max(25,80-wave*4);
  }
  // balles
  for(const b of bullets){
    b.x+=b.vx;b.y+=b.vy;b.life--;b.dist+=b.sp||0;
    for(const z of zombies){
      if(b.hit.has(z)||z.hp<=0||z.emerge>0) continue;
      const zh=70*z.size;
      if(Math.abs(b.x-z.x)<14*z.size && b.y<z.y && b.y>z.y-zh){

  // zombies
  for(const z of zombies){
    if(z.emerge>0){                                              // sort du sol : intouchable et inoffensif pendant ce temps
      z.emerge--;z.dir=p.x>z.x?1:-1;
      if(z.emerge%4===0) particles.push({x:z.x+(Math.random()-.5)*50,y:GROUND-2,vx:(Math.random()-.5)*3,vy:-2-Math.random()*3,life:26,col:'#6b5a48'});

    const fz=fxB.freeze>0?.3:1,rush=Math.abs(z.x-p.x)>W*.7?2.4:1;z.x+=z.dir*z.speed*fz*rush; z.step+=0.15*z.speed*fz;

// --- Boucle ---
let last=performance.now();
let emaDt=16.7,adaptT=0;
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  emaDt+=(dt-emaDt)*.05;adaptT+=dt;
  if(adaptT>3000&&!document.hidden){adaptT=0;if((SET.gfx||'auto')==='auto'&&emaDt>26&&RES>1){autoCap=Math.max(1,RES-.5);fit()}}   // Auto : si le jeu rame, la résolution baisse toute seule
  try{update(dt);draw()}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
applyMap();reset(true);
makeTextures();
if(document.fonts){document.fonts.load('700 20px Oswald');document.fonts.load('400 20px "Black Ops One"')}
READY=true;fit();
requestAnimationFrame(loop);
