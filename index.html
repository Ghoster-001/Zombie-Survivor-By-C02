<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="safe" style="position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)"></div>
<div id="rot"><i></i><div id="rot1"></div><div id="rot2"></div><b id="rot3">▶ OK</b></div>
<script>
// ===== Stickman vs Zombies : base de jeu originale =====
const cv = document.getElementById('c');
let ctx = cv.getContext('2d',{alpha:false});
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(Array.isArray(r)?(r[0]||0):(r||0),Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}   // anciens navigateurs mobiles
const MOBILE=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
// Qualité graphique : résolution interne du canvas (1x = 960 px de large ... 8x = 7680 px, soit 8K). « Auto » suit la résolution réelle de l'écran et se réduit seule si le jeu rame.
const GFX=[{id:'auto',n:'AUTO'},{id:'std',n:'STANDARD',r:1},{id:'high',n:'HAUTE',r:2},{id:'ultra',n:'ULTRA',r:3},{id:'4k',n:'4K',r:4},{id:'8k',n:'8K',r:8}];
let autoCap=MOBILE?2:4,RES=1,RESd=0;
// Profils graphiques : AUTO règle tout seul (la résolution puis les effets baissent si le jeu rame), les autres figent les réglages.
const PROFS=[{id:'auto',n:'AUTO'},
 {id:'eco',n:'ÉCO',gfx:'std',fps:30,lights:0,fog:0,refl:0,post:0,bloom:0,parts:0,anim:0},
 {id:'low',n:'BAS',gfx:'std',fps:60,lights:0,fog:0,refl:0,post:0,bloom:0,parts:1,anim:1},
 {id:'med',n:'MOYEN',gfx:'high',fps:60,lights:1,fog:0,refl:0,post:1,bloom:0,parts:1,anim:2},
 {id:'high',n:'ÉLEVÉ',gfx:'high',fps:0,lights:1,fog:1,refl:1,post:1,bloom:0,parts:2,anim:2},
 {id:'ultra',n:'ULTRA',gfx:'ultra',fps:0,lights:1,fog:1,refl:1,post:1,bloom:0,parts:2,anim:2},
 {id:'extreme',n:'EXTRÊME',gfx:'4k',fps:0,lights:1,fog:1,refl:1,post:1,bloom:1,parts:3,anim:2},
 {id:'custom',n:'PERSONNALISÉ'}];
const PARTS=[{n:'MINIMALES',q:.3,max:110},{n:'RÉDUITES',q:.6,max:240},{n:'NORMALES',q:1,max:520},{n:'MAXIMALES',q:1.7,max:1000}];
let autoDrop=MOBILE?2:0;                                              // paliers d'économie automatiques (profil AUTO) : 1 bloom · 2 reflets · 3 brume · 4 lumières · 5 vignette/grain · 6 particules
let FXF={lights:1,fog:1,refl:1,post:1,bloom:0,pq:1,pmax:520,fps:60,xtra:0,anim:2},ATK=0,uiDirty=true,lastUiState='',lastBright=-1;
// --- taux de rafraîchissement de l'écran : mesuré à l'exécution, les limites de FPS proposées vont jusqu'à lui ---
let HZ=60,HZm=60,hzS=[];
function hzSample(dt){
  if(document.hidden||dt<.4||dt>60) return;
  hzS.push(dt);
  if(hzS.length>=90){
    hzS.sort((a,b)=>a-b);const est=1000/hzS[Math.floor(hzS.length*.1)];hzS=[];
    let best=Math.round(est);for(const v of[24,30,48,50,60,72,75,85,90,100,120,144,165,180,200,240,280,300,360,480,500,1000]) if(Math.abs(v-est)/v<.06){best=v;break}
    if(best>HZm||!hzSample.set){HZm=hzSample.set?Math.max(HZm,best):best;hzSample.set=1}
  }
}
function fpsOptions(){const o=[30,45,60,75,90,120,144,165,240,360,480,500,1000].filter(v=>v<HZ-1);return o.concat([0])}   // 0 = taux de l'écran
const fpsName=v=>v>0?String(v):'ÉCRAN ('+HZ+')';
// --- compteur FPS (à la Steam) ---
const FC_DEF={on:false,fx:0,fy:0,pos:'tl',size:1,op:.9,bg:1,col:'auto',fps:1,ms:0,low:0,avg:0,res:0,prof:0,graph:0};
const FT=new Float32Array(240);let ftN=0,fcT=0,fcFrames=0,fcStat={fps:0,ms:0,low:0,avg:0,min:0,max:0};
function ftPush(d){FT[ftN%240]=d;ftN++;fcFrames++}
function fcUpdate(t){
  if(t-fcT<250) return;
  const el=t-fcT;fcT=t;fcStat.fps=Math.round(fcFrames*1000/el);fcFrames=0;
  const n=Math.min(240,ftN);if(n<3) return;
  const a=Array.from(FT.subarray(0,n)).sort((x,y)=>x-y);let sum=0;for(const v of a) sum+=v;
  fcStat.low=1000/a[Math.min(n-1,Math.floor(n*.99))];fcStat.min=1000/a[n-1];fcStat.max=1000/a[0];fcStat.avg=1000*n/sum;
  let r=0;const m=Math.min(15,n);for(let i=0;i<m;i++) r+=FT[(ftN-1-i+240)%240];fcStat.ms=r/m;
}
function drawFps(){
  const f=SET.fc;if(!f.on) return;
  const st=fcStat,L=[];
  if(f.fps) L.push([String(st.fps),'FPS',1]);
  if(f.ms) L.push([st.ms.toFixed(1)+' ms','',0]);
  if(f.low) L.push(['1 % bas  '+Math.round(st.low),'',0]);
  if(f.avg) L.push(['moy '+Math.round(st.avg)+'   min '+Math.round(st.min)+'   max '+Math.round(st.max),'',0]);
  if(f.res) L.push([cv.width+'×'+cv.height+'  ('+RES+'×)','',0]);
  if(f.prof) L.push([(PROFS.find(x=>x.id===SET.prof)||PROFS[0]).n+(SET.prof==='auto'&&autoDrop?' (−'+autoDrop+')':''),'',0]);
  const sz=f.size;
  ctx.save();ctx.setTransform(RES,0,0,RES,0,0);
  let bw=0,bh=8*sz;
  for(const l of L){ctx.font=(l[2]?'700 ':'600 ')+(l[2]?24:13)*sz+'px '+FONT;let w=ctx.measureText(l[0]).width;if(l[1]){ctx.font='600 '+11*sz+'px '+FONT;w+=ctx.measureText(l[1]).width+6*sz}bw=Math.max(bw,w);bh+=(l[2]?28:17)*sz}
  const gh=f.graph?34*sz:0,gw=Math.max(bw,100*sz);if(f.graph){bw=gw;bh+=gh+4*sz}
  bw+=16*sz;if(!L.length&&!f.graph){ctx.restore();return}
  const m=8,x=m+f.fx*Math.max(0,W-bw-2*m),y=m+f.fy*Math.max(0,H-bh-2*m);
  ctx.globalAlpha=f.op;
  if(f.bg){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(x,y,bw,bh)}
  const colOf=v=>f.col==='white'?'#f2f2f2':f.col==='green'?'#7dff6a':f.col==='yellow'?'#ffe14a':(v>=55?'#7dff6a':v>=30?'#ffe14a':'#ff6a5a');
  let cy=y+4*sz;ctx.textAlign='left';
  for(const l of L){
    const big=l[2];cy+=(big?24:13)*sz+(big?0:1);
    ctx.font=(big?'700 ':'600 ')+(big?24:13)*sz+'px '+FONT;
    const c=big?colOf(st.fps):(f.col==='auto'?'#e8e8e8':colOf(60));
    if(!f.bg){ctx.fillStyle='#000';ctx.fillText(l[0],x+8*sz+1,cy+1)}
    ctx.fillStyle=c;ctx.fillText(l[0],x+8*sz,cy);
    if(l[1]){const w=ctx.measureText(l[0]).width;ctx.font='600 '+11*sz+'px '+FONT;ctx.fillStyle='#c8c8c8';ctx.fillText(l[1],x+8*sz+w+6*sz,cy)}
    cy+=(big?4:3)*sz;
  }
  if(f.graph){
    const gx=x+8*sz,gy=y+bh-gh-4*sz,n=Math.min(90,ftN),bwid=(gw)/90;
    ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(gx,gy,gw,gh);
    for(let i=0;i<n;i++){const d=FT[(ftN-1-i+240)%240],hh=Math.min(gh,gh*d/50);ctx.fillStyle=d<=18?'#7dff6a':d<=33?'#ffe14a':'#ff6a5a';ctx.fillRect(gx+gw-(i+1)*bwid,gy+gh-hh,Math.max(1,bwid-.5),hh)}
  }
  ctx.restore();
}
// --- interpolation : à plus de 60 FPS, les positions sont lissées entre deux pas de logique ---
let prevValid=false,prevCam=0,intList=[],savedCam=0;
function snapPrev(){
  const f=o=>{o.px=o.x;o.py=o.y};
  f(player);for(const z of zombies) f(z);for(const b of bullets) f(b);for(const q of particles) f(q);for(const a of acid) f(a);for(const b of bonuses) f(b);for(const c of crates) f(c);for(const e of ents) f(e);
  prevCam=camX;prevValid=true;
}
function interpOn(al){
  intList.length=0;
  const g=o=>{if(o.px===undefined) return;const dx=o.x-o.px,dy=o.y-o.py;if((dx===0&&dy===0)||dx*dx+dy*dy>40000) return;o.sx=o.x;o.sy=o.y;o.x=o.px+dx*al;o.y=o.py+dy*al;intList.push(o)};
  g(player);for(const z of zombies) g(z);for(const b of bullets) g(b);for(const q of particles) g(q);for(const a of acid) g(a);for(const b of bonuses) g(b);for(const c of crates) g(c);for(const e of ents) g(e);
  savedCam=camX;const dc=camX-prevCam;if(Math.abs(dc)<300) camX=prevCam+dc*al;
}
function interpOff(){for(const o of intList){o.x=o.sx;o.y=o.sy}intList.length=0;camX=savedCam}
function fxUpdate(){
  const s=SET;HZ=s.hz>0?s.hz:HZm;const a=s.prof==='auto'?autoDrop:0;
  let pi=Math.max(0,Math.min(3,s.parts|0));if(a>=1) pi=Math.min(pi,2);if(a>=5) pi=Math.min(pi,1);if(a>=6) pi=0;
  FXF.lights=s.lights&&a<4?1:0;FXF.fog=s.fog&&a<3?1:0;FXF.refl=s.refl&&a<2?1:0;FXF.post=s.post&&a<5?1:0;FXF.bloom=s.bloom&&a<1?1:0;
  FXF.pq=PARTS[pi].q;FXF.pmax=PARTS[pi].max;FXF.fps=s.fps>0?Math.max(15,Math.min(s.fps,HZ)):HZ;
  {let an=[0,1,2].includes(s.anim)?s.anim:2;if(a>=6) an=0;else if(a>=5) an=Math.min(an,1);FXF.anim=an}
  if(s.bright!==lastBright){lastBright=s.bright;const b=Math.max(0,Math.min(1,+s.bright)),f=b<=.5?.35+b/.5*.65:1+(b-.5)*1.4;cv.style.filter=Math.abs(f-1)<.01?'':'brightness('+f.toFixed(2)+')'}   // luminosité : filtre CSS (aucun coût au dessin)
  FXF.xtra=(s.bloom&&s.fog&&s.lights&&pi>=3&&a<1)?1:0;               // qualité supérieure : plus de brume, de rayons de lumière et de particules
}
function setProfile(id){
  const p=PROFS.find(x=>x.id===id)||PROFS[0];SET.prof=p.id;
  if(p.id==='auto'){Object.assign(SET,{gfx:'auto',lights:1,fog:1,refl:1,post:1,bloom:0,parts:2,fps:0,anim:2});autoDrop=MOBILE?2:0}
  else if(p.id!=='custom'){Object.assign(SET,{gfx:p.gfx,fps:p.fps,lights:p.lights,fog:p.fog,refl:p.refl,post:p.post,bloom:p.bloom,parts:p.parts,anim:p.anim})}
  saveOpts();fit();
}
const fxToggle=k=>{SET[k]=SET[k]?0:1;SET.prof='custom';saveOpts()};
let BLC=null,BLC2=null;
function doBloom(){                                                    // lueur : le rendu est réduit, flouté et éclairci puis rajouté en additif
  const bw=Math.max(64,Math.round(W/4)),bh=Math.max(36,Math.round(H/4));
  if(!BLC||BLC.width!==bw||BLC.height!==bh){BLC=document.createElement('canvas');BLC.width=bw;BLC.height=bh;BLC2=document.createElement('canvas');BLC2.width=bw;BLC2.height=bh}
  const a=BLC.getContext('2d'),b=BLC2.getContext('2d');
  a.globalCompositeOperation='copy';a.drawImage(cv,0,0,cv.width,cv.height,0,0,bw,bh);
  b.globalCompositeOperation='copy';let ok=false;try{b.filter='blur(3px) brightness(1.2) contrast(1.6)';ok=b.filter!=='none'}catch(e){}
  b.drawImage(BLC,0,0);try{b.filter='none'}catch(e){}
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=ok?.5:.22;ctx.drawImage(BLC2,0,0,W,H);ctx.restore();
}

function resWanted(vw){
  let g='auto';try{g=SET.gfx||'auto'}catch(e){}
  const q=GFX.find(x=>x.id===g)||GFX[0];
  let r=q.r||Math.max(1,Math.min(autoCap,Math.max(MOBILE?1.5:2,(vw*(window.devicePixelRatio||1))/W)));   // Auto : au moins 2x (suréchantillonnage), jusqu'à la résolution réelle de l'écran
  const maxA=MOBILE?16e6:36e6;                                       // limite de surface des navigateurs
  while(r>1&&W*H*r*r>maxA) r-=.25;
  return Math.round(r*4)/4;
}
let W=960,H=540,GROUND=460;const GRAV=0.7;   // coordonnées logiques : s'adaptent au format de l'écran (voir fit) ; le canvas fait 2x ces valeurs
cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);ctx=cv.getContext('2d');ctx.scale(RES,RES);
const GAME_VERSION='0.60';const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));   // +0.01 à chaque mise à jour
var READY=false,FORCED=false,CW=1,CH=1;
// Le jeu s'adapte au format de l'écran (de 6:5 à 3:1) : la zone de jeu s'élargit (ou s'agrandit en hauteur) pour remplir tout l'écran, sans bandes noires.
const SAFE={l:0,r:0};
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('safe')),k=W/Math.max(1,cv.getBoundingClientRect().width);SAFE.l=(parseFloat(cs.paddingLeft)||0)*k;SAFE.r=(parseFloat(cs.paddingRight)||0)*k}catch(e){}
}
function fit(){
  const vv=window.visualViewport;let vw=Math.max(1,vv?vv.width:innerWidth),vh=Math.max(1,vv?vv.height:innerHeight);
  FORCED=READY&&vh>vw*1.02&&touchOn();                      // téléphone tenu en portrait : le jeu est pivoté de 90° pour rester en paysage, même avec le verrouillage de rotation
  if(FORCED){const t=vw;vw=vh;vh=t}
  const asp=vw/vh,a=Math.max(1.2,Math.min(3,asp));
  let nw,nh;if(a>=16/9){nh=540;nw=Math.round(540*a)}else{nw=960;nh=Math.round(960/a)}
  const rw=resWanted(vw);
  if(nw!==W||nh!==H||rw!==RESd){
    RES=RESd=rw;
    const dG=(nh-80)-GROUND;
    W=nw;H=nh;GROUND=nh-80;if(READY&&MP.on&&MP.rp){WORLD_W=nw;camX=0}
    cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);cv.getContext('2d').setTransform(RES,0,0,RES,0,0);cv.getContext('2d').imageSmoothingQuality='high';
    if(READY&&dG){try{                                                 // le sol change de hauteur (plein écran, rotation) : tout ce qui est posé dessus suit
      for(const arr of[zombies,crates,decals,particles,bonuses,ents,acid,bullets,fx]) for(const o of arr) if(typeof o.y==='number') o.y+=dG;
      player.y+=dG;for(const g of MP.guests) if(g.p) g.p.y+=dG;for(const o of MP.others.values()) if(typeof o.y==='number') o.y+=dG;
    }catch(e){}}
  }
  const cw=asp>=1.2&&asp<=3?vw:(asp>3?vh*3:vw),ch=asp>=1.2&&asp<=3?vh:(asp>3?vh:vw/1.2);
  cv.style.width=cw+'px';cv.style.height=ch+'px';CW=cw;CH=ch;cv.style.transform=FORCED?'rotate(90deg)':'';cv.style.flex='none';
  if(READY){if(FORCED){SAFE.l=SAFE.r=0}else readSafe();layoutTouch();updateRot()}
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));if(window.visualViewport) visualViewport.addEventListener('resize',fit);fit();
function toggleFullIn(){try{if(document.fullscreenElement||document.webkitFullscreenElement) return;const el=document.documentElement,r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);const lock=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};if(r&&r.then) r.then(lock).catch(()=>{}); else lock()}catch(e){}}
function toggleFull(){
  try{
    const el=document.documentElement;
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
    const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    const lock=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}};
    if(r&&r.then) r.then(lock).catch(()=>{}); else lock();
  }catch(e){}
}

// --- Données de configuration (à modifier facilement) ---
const SKINS=[{id:'orig',n:'ORIGINAL'},{id:'gold',n:'OR',c:'#e0a820'},{id:'red',n:'ROUGE',c:'#c9372c'},{id:'blue',n:'BLEU',c:'#2f6fd0'},{id:'green',n:'VERT',c:'#3da05a'},{id:'purple',n:'VIOLET',c:'#8a4fd0'},{id:'orange',n:'ORANGE',c:'#e0832a'},{id:'pink',n:'ROSE',c:'#e05a9a'},{id:'cyan',n:'CYAN',c:'#2fc7d6'},{id:'white',n:'BLANC',c:'#e8e8ee'}];
const WOODS=[{id:'orig',n:'ORIGINAL'},{id:'dark',n:'FONCÉ',c:'#4e2d16'},{id:'light',n:'CLAIR',c:'#d6b27c'}];
const CAT=['MÊLÉE','PISTOLETS','PM','ASSAUT','POMPES','PRÉCISION','LOURDES','SPÉCIAL','AKIMBO'];
const KINDS={
  pistol:{len:22,thick:7},revolver:{len:24,thick:8},deagle:{len:26,thick:9},nailgun:{len:20,thick:8},
  smg:{len:26,thick:7},ak:{len:44,thick:8},m4:{len:44,thick:8},lmg:{len:48,thick:9},
  shotgun:{len:42,thick:8},dmr:{len:50,thick:7,scope:true},barrett:{len:58,thick:9,scope:true},
  minigun:{len:54,thick:14},crossbow:{len:30,thick:8},bow:{len:24,thick:5},flamer:{len:40,thick:11},
  launcher:{len:48,thick:12},rail:{len:50,thick:8},laser:{len:40,thick:6},
};
// portée utile (px) : ni trop courte ni infinie — l'écran fait ~960 px de large
const RANGE={pistol:640,revolver:720,deagle:780,nailgun:480,smg:640,ak:960,m4:1000,lmg:1000,shotgun:500,dmr:1250,barrett:1450,minigun:900,crossbow:850,bow:780,flamer:150,launcher:950,rail:1600,laser:1150};
const PALS=[['#2a2a2e','#8a5a30'],['#33363a','#6b4a2a'],['#2f3a2c','#7a5a30'],['#3a3a3a','#a07040'],['#2a303a','#5a3a22'],['#44413a','#8a6a40']];
const WEAPONS=[];
function M(name,kind,dmg,rate,reach,o){WEAPONS.push(Object.assign({cat:'MÊLÉE',name,kind,melee:true,dmg,rate,reach,auto:true},o||{}))}
function G(cat,name,kind,dmg,rate,spread,speed,pierce,auto,o){
  WEAPONS.push(Object.assign({cat,name,kind,dmg,rate,pellets:1,spread,speed,pierce,auto:!!auto,range:RANGE[kind]||800},KINDS[kind],o||{}));
}
const NEWWS={},NEWWSG={};   // sons des nouvelles armes (fusionnés avec WS / WSG plus bas)
function N(cat,name,kind,dmg,rate,spread,speed,pierce,auto,snd,o){G(cat,name,kind,dmg,rate,spread,speed,pierce,auto,o);if(kind==='shotgun'&&snd&&snd.length===4&&typeof snd[0]==='number') NEWWSG[name]=snd; else if(snd) NEWWS[name]=snd}
// Akimbo : deux armes, une par main, qui tirent chacune leur tour
function D(name,a,b){
  const A=WEAPONS.find(w=>w.name===a),B=WEAPONS.find(w=>w.name===b);if(!A||!B) throw new Error('akimbo '+name);

  if(f<1){c=Object.assign({},c,{ammo:c.ammo?Math.max(1,Math.round(c.ammo*f)):0,time:c.time?Math.max(1000,Math.round(c.time*f)):0});if(c.gift&&c.gift.v) c.gift=Object.assign({},c.gift,{v:Math.max(1,Math.round(c.gift.v*f))})}
  if(c.sup){applyBonus(c.sup,f);sfx('crate');if(f<1) flash('CAISSE ABÎMÉE : '+Math.round(f*100)+' %');return}
  if(c.gift&&(c.gift.k==='heal'||c.gift.k==='shield')){applyBonus(c.gift.k,f);sfx('crate');for(const col of['#ffd45a','#e2542e','#4ac86a']) burst(c.x,c.y-16,col,4);return}
  if(c.gift&&c.gift.k!=='weapon'){
    const m=c.gift.k==='money',v=c.gift.v;sfx('crate');sfx('bonus');
    if(m){const g=addMoney(v,'bonus');flash('CADEAU : +'+Math.round(g)+' $')}else{const g=addXp(v,'bonus');flash('CADEAU : +'+Math.round(g)+' XP')}
    for(const col of['#ffd45a','#e2542e','#4ac86a','#4aa0e8']) burst(c.x,c.y-16,col,6);return}
  const w=WEAPONS[c.w],g=player.gun;
  if(g&&g.w===c.w&&((g.time>0)===(c.time>0))){g.ammo+=c.ammo;g.time+=c.time;g.a0+=c.ammo;g.t0+=c.time}
  else{player.gun={w:c.w,ammo:c.ammo,time:c.time,a0:c.ammo,t0:c.time};if(c.gift&&c.gift.rare){player.gun.gl=c.gl;player.gun.gs=c.gs;player.gun.gwd=c.gwd}}
  player.w=c.w;
  flash(tr(w.name).toUpperCase()+'  ·  '+(c.time?Math.round(c.time/1000)+' '+tr('secondes').toUpperCase():c.ammo+' '+tr('munitions').toUpperCase()));
  if(c.gift&&c.gift.rare){const sk=SKINS.find(k=>k.id===c.gs);flash('ARME RARE : '+w.name.toUpperCase()+'  NIV.'+c.gl+(sk?'  ·  '+sk.n:''))}
  burst(c.x,c.y-14,'#ffd45a',14);sfx('crate');
}
function useAmmo(){
  const g=player.gun;
  if(!g||g.time>0) return;                 // arme limitée en durée : pas de munitions
  if(--g.ammo<=0) dropGun('PLUS DE MUNITIONS');
}
function updateCrates(dt,p){
  if(p.gun&&p.gun.time>0){p.gun.time-=dt;if(p.gun.time<=0) dropGun('TEMPS ÉCOULÉ')}
  crateT-=dt;
  if(crateT<=0){spawnCrate();crateT=(15000+rnd()*20000)/curMap.crate}
  supT-=dt;if(supT<=0){spawnSupply();supT=(25000+rnd()*25000)/curMap.sup}
  nearC=null;let best=touchOn()?96:48;                      // caisse à portée : elle se ramasse avec la touche, plus automatiquement
  for(const c of crates){
    if(!c.landed){
      c.vy=Math.min(2.4,c.vy+.04);c.y+=c.vy;c.x+=Math.sin(tick*.03+c.ph)*.4;
      if(c.y>=GROUND){c.y=GROUND;c.landed=true;burst(c.x,c.y-6,'#c9b27a',8)}
    } else{
      c.age+=dt;
      for(const z of zombies){if(z.hp>0&&!(z.emerge>0||z.inv)&&z.fall===undefined&&Math.abs(z.x-c.x)<22){c.hp=Math.max(0,(c.hp===undefined?1:c.hp)-.004);if(c.hp<=0){c.dead=true;burst(c.x,c.y-12,'#9a7440',10);sfx('bhit');flash('CAISSE DÉTRUITE !');break}}}   // les zombies qui passent dessus l'abîment
    }
    const d=Math.hypot(p.x-c.x,(p.y-30)-(c.y-12));
    if(d<best){best=d;nearC=c}
    if(c.age>(c.sup?SUP_LIFE:c.gift?32000:22000)) c.dead=true;
  }
  crates=crates.filter(c=>!c.dead);
  if(nearC&&nearC.dead) nearC=null;
}
function tryPickup(){
  if(mpGuest()){mpSend({t:'ev',k:'pick'});return}
  if(player.dead||!nearC||nearC.dead||!crates.includes(nearC)) return;
  const c=nearC;pickCrate(c);c.dead=true;crates=crates.filter(k=>!k.dead);nearC=null;if(mpHost()) mpShareGift(c,null);
}

    } else {
      rrect(c.x-14,c.y-22,28,22,2,'#9a7440');
      ctx.fillStyle='#5a4220';ctx.fillRect(c.x-14,c.y-22,28,4);ctx.fillRect(c.x-14,c.y-4,28,4);ctx.fillRect(c.x-3,c.y-22,6,22);
      ctx.fillStyle='#f2efe8';ctx.font='700 14px '+FONT;ctx.textAlign='center';ctx.fillText('?',c.x+9,c.y-8);ctx.textAlign='left';

    const c=nearC,k=KEYS.pick.find(x=>x),txt=touchOn()?tr('Touche pour ramasser').toUpperCase():k?'['+keyName(k)+']  '+tr('Ramasser').toUpperCase():tr('Définis une touche (Options)').toUpperCase();

function buyWeapon(i){
  const w=WEAPONS[i];
  if(isOwned(i)){upSel=i;state='weapon';return}                       // arme possédée : page de détail (améliorations, couleur, équiper)
  if(curLevel()<w.lvl){flash(tr('Niveau {0} requis',w.lvl));return}
  if(save.bank<w.cost){flash('Pas assez d\'argent');return}
  save.bank-=w.cost;save.own[w.name]=true;sfx('buy');
  if(w.melee) save.melee=w.name;
  persist();
}
function buyUp(){
  const i=upSel,l=upLvl(i);
  if(l>=4) return;
  const c=upCost(i,l+1);
  if(save.bank<c){flash('Pas assez d\'argent');return}
  save.bank-=c;sfx('buy');
  const n=WEAPONS[i].name,u=save.up[n]=save.up[n]||{lvl:0,skin:'orig'};
  u.lvl=l+1;
  if(u.lvl===4){u.skin='gold';flash('MOD OR DÉBLOQUÉ !')}
  persist();
}
function setWood(id){
  const u=save.up[WEAPONS[upSel].name];
  if(!u||u.lvl<4) return;
  u.wood=id;persist();
}
function setSkin(id){
  const n=WEAPONS[upSel].name,u=save.up[n];
  if(!u||u.lvl<4) return;
  u.skin=id;persist();
}
function explode(x,y,r,dmg){
  for(const z of zombies){
    if(z.hp<=0||z.emerge>0||z.inv) continue;
    const d=Math.hypot(z.x-x,(z.y-30)-y);
    if(d<r) z.hp-=dmg*(1-d/(r*1.4));
  }
  fx.push({x,y,r,life:18});burst(x,y,'#ffb040',22);smokePuff(x,y-10,Math.min(10,4+Math.round(r/25)));sfx('boom');
  if(SET.shake) shake=Math.max(shake,10);
}
function buyHp(){
  if(save.hpLvl>=MAX_UP) return;
  if(save.bank<hpCost()){flash('Pas assez d\'argent');return}
  save.bank-=hpCost();save.hpLvl++;persist();sfx('buy');
}
function finishRun(){
  if(state==='over') return;
  if(ACG.st.cheat){money=0;runXp=0;ACG.note('Gains de la partie annulés')}
  sfx('over');state='over';
  if(training){runGain=0;runXp=0;overXp=save.xp;overLvl=levelOf(save.xp);overPulse=0;msgT=0;return}   // entraînement : rien n'est sauvegardé
  recordWaves();runGain=money; save.bank+=money; save.xp+=runXp; overXp=xpStart; overLvl=levelOf(xpStart); overPulse=0; msgT=0; save.best=Math.max(save.best,wave); persist();
}

let AC=null,AMASTER=null,AVERB=null,ANOISE=null;const lastSfx={};
function audioBuild(c){
  AC=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
  AMASTER=c.createGain();AMASTER.gain.value=.55*SET.vol;AMASTER.connect(comp);comp.connect(c.destination);
  const n=c.sampleRate*2;ANOISE=c.createBuffer(1,n,c.sampleRate);const d=ANOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const L=Math.floor(c.sampleRate*1.3),ir=c.createBuffer(2,L,c.sampleRate);
  for(let ch=0;ch<2;ch++){const dd=ir.getChannelData(ch);for(let i=0;i<L;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2)}
  AVERB=c.createConvolver();AVERB.buffer=ir;const vg=c.createGain();vg.gain.value=.5;AVERB.connect(vg);vg.connect(AMASTER);
}
function audioInit(){
  if(!started){started=true;musicApply()}
  if(AC){if(AC.state==='suspended'&&AC.resume) AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C) return;
  try{audioBuild(new C())}catch(e){AC=null}
}

function env(g,t,dur,vol,att){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.002));g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function nz(t,dur,o){                                  // rafale de bruit filtré (souffle, détonation, impact)
  o=o||{};const s=AC.createBufferSource();s.buffer=ANOISE;
  const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||.8;f.frequency.setValueAtTime(o.f||1000,t);
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+dur);
  const g=AC.createGain();env(g,t,dur,o.vol==null?1:o.vol,o.att);
  s.connect(f);f.connect(g);g.connect(AMASTER);
  if(o.rev){const r=AC.createGain();r.gain.value=o.rev;g.connect(r);r.connect(AVERB)}
  s.start(t,Math.random()*.6);s.stop(t+dur+.05);
}
function tone(t,dur,o){                                // oscillateur (corps grave, corde, laser, voix)
  o=o||{};const s=AC.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f||100,t);
  if(o.f2) s.frequency.exponentialRampToValueAtTime(Math.max(15,o.f2),t+dur);
  const g=AC.createGain();env(g,t,dur,o.vol==null?1:o.vol,o.att);
  let out=s;if(o.lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;s.connect(f);out=f}
  out.connect(g);g.connect(AMASTER);
  if(o.rev){const r=AC.createGain();r.gain.value=o.rev;g.connect(r);r.connect(AVERB)}
  s.start(t);s.stop(t+dur+.05);
}

// --- Logique ---
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)};
function segBox(x0,y0,x1,y1,l,t,r,b){                              // le segment (x0,y0)→(x1,y1) traverse-t-il la boîte ?
  let u0=0,u1=1;const dx=x1-x0,dy=y1-y0;
  for(const[p,q] of[[-dx,x0-l],[dx,r-x0],[-dy,y0-t],[dy,b-y0]]){
    if(p===0){if(q<0) return false}
    else{const u=q/p;if(p<0){if(u>u1) return false;if(u>u0) u0=u}else{if(u<u0) return false;if(u<u1) u1=u}}
  }
  return true;
}
function shoot(){
  const wp=WEAPONS[player.w];let hw=wp,side=0;
  if(wp.hands){side=player.hand=1-(player.hand||0);hw=WEAPONS[wp.hi[side]];player[side?'muz1':'muz0']=70}   // akimbo : une main puis l'autre
  const px=player.x, py=player.y-48+(wp.hands?(side?5:-3):0);
  const base=aimOv!==null?aimOv:(aimDir()?(player.face>0?0:Math.PI):Math.atan2(mouse.y-py,mouse.x+camX-px));
  const sh=hw.kind==='shotgun';
  for(let i=0;i<hw.pellets;i++){
    // fusil à pompe : gerbe de plombs en cloche (la plupart près de l'axe, quelques-uns plus écartés) ; autres armes : dispersion uniforme
    const a=sh?base+Math.max(-hw.spread*.5,Math.min(hw.spread*.5,gauss()*hw.spread*.2)):base+(Math.random()-.5)*hw.spread*2;
    const sp=hw.speed*(sh?.93+Math.random()*.14:1),life=hw.life||Math.ceil(hw.range/sp);
    bullets.push({x:px+Math.cos(base)*22,y:py+Math.sin(base)*22,ox:px,oy:py,
      vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sp,dist:0,range:hw.range,fall:sh,
      dmg:hw.dmg*player.dmgMul*wBoost(player.w)*dmgM(),pierce:hw.pierce,life,l0:life,hit:new Set(),
      col:hw.col||'#ff0',aoe:hw.aoe||0,fire:!!hw.fire,size:hw.size||2});
  }
  if(['pistol','revolver','deagle','smg','ak','m4','lmg','dmr','barrett','minigun','shotgun'].includes(hw.kind)&&hw.kind!=='revolver'&&!hw.fire) particles.push({x:px,y:py-2,vx:-player.face*(1+Math.random()*1.8),vy:-2-Math.random()*2.2,life:90,ml:90,shell:true,rot:0,g:.32,col:hw.kind==='shotgun'?'#c9372c':'#d9b34a'});
  player.cd=(wp.hands?hw.rate*.6:wp.rate)/rapM(); player.firedThisClick=true;
  playGun(hw);
}
function slash(){
  const wp=WEAPONS[player.w];
  player.cd=wp.rate/rapM(); player.swing=180;
  playSwing(wp);let hitAny=false;
  for(const z of zombies){
    if(z.hp<=0||z.emerge>0||z.inv) continue;
    const dx=(z.x-player.x)*player.face;
    if(dx>-10 && dx<wp.reach+14*z.size){
      z.hp-=wp.dmg*player.dmgMul*wBoost(player.w)*dmgM(); z.x+=player.face*22/z.size; burst(z.x,z.y-40,'#a22',6);hitAny=true;
    }
  }

function dropBonus(z){
  const ch=(z.type==='tank'?.3:z.type==='fast'?.09:.06)*curMap.drop;
  if(Math.random()>=ch) return;
  const ks=BKEYS().filter(k=>training?k!=='cash':bowned(k)),low=player.hp<player.maxhp*.5;
  if(!ks.length) return;

  let r=Math.random()*tot,i=0;while(i<ks.length-1&&(r-=ws[i])>0) i++;

function applyBonus(type,fr,gold){
  const p=player,B=BON[type],L=LV(type,gold);fr=fr===undefined?1:fr;
  if(type==='heal') p.hp=Math.min(p.maxhp,p.hp+Math.round(p.maxhp*healFr(L)*fr));

function updateBonus(dt){
  const p=player;
  for(const k in fxB) if(fxB[k]>0) fxB[k]=Math.max(0,fxB[k]-dt);
  if(dailyB){dailyT-=dt;if(dailyT<=0&&bonuses.length<6){dailyT=60000;bonuses.push({x:Math.max(40,Math.min(WORLD_W-40,p.x+(Math.random()<.5?-1:1)*(120+Math.random()*100))),y:GROUND-130,vy:-3,type:dailyB.id,life:20000,gold:dailyB.gold,daily:true});sfx('click')}}
  const mg=fxB.magnet>0?magR(fxL.magnet||0):0;
  for(const b of bonuses){
    b.life-=dt;b.vy+=.35;b.y+=b.vy;if(b.y>GROUND-16){b.y=GROUND-16;b.vy=0}
    if(mg&&Math.abs(b.x-p.x)<mg) b.x+=Math.sign(p.x-b.x)*Math.min(7,Math.abs(p.x-b.x));
    {const TB2=targets().find(t=>Math.abs(b.x-t.p.x)<28&&t.p.y>GROUND-70);if(TB2){asT(TB2,()=>applyBonus(b.type,1,b.gold));b.life=0}}
  }
  pack(bonuses,b=>b.life>0);
  if(turret){
    turret.t-=dt;turret.cd-=dt;
    if(turret.cd<=0){
      let best=null,bd=520;for(const z of zombies){if(z.hp<=0||z.emerge>0||z.inv) continue;const d=Math.abs(z.x-turret.x);if(d<bd){bd=d;best=z}}

        turret.cd=230;sfx('turret');

}

  const b=BDEF[id],cur=save.boost[id],k=cur===undefined?(bRev(b)?1:0):cur+1;
  if(k>bMax(b)) return;
  const need=bReq(b,k),cost=bCostK(b,k);
  if(curLevel()<need){flash('Niveau '+need+' requis');return}
  if(save.bank<cost){flash("Pas assez d'argent");return}
  save.bank-=cost;save.boost[id]=k;sfx('buy');persist();
}

function capEnt(k,n){const l=ents.filter(e=>e.k===k);while(l.length>n){const o=l.shift();o.dead=true}ents=ents.filter(e=>!e.dead)}
function placeBoost(type,L){
  const p=player,f=p.face||1,cl=x=>Math.max(60,Math.min(WORLD_W-60,x)),add=e=>{ents.push(e);return e};
  switch(type){
    case 'barricade':{const n=barN(L);for(let i=0;i<n;i++) add({k:'barr',x:cl(p.x+(i===0?f*85:i===1?-f*85:f*160)),hp:barHp(L),max:barHp(L),w:28,blk:1});capEnt('barr',6);break}
    case 'icewall':{const n=L>=3?2:1,hp=iceHp(L);for(let i=0;i<n;i++) add({k:'barr',ice:1,x:cl(p.x+(i?-f:f)*90),hp,max:hp,w:30,blk:1,t:12000+1000*L});capEnt('barr',6);break}
    case 'teddy':{const n=L>=4?2:1;for(let i=0;i<n;i++) add({k:'ted',x:cl(p.x+(i?-f:f)*95),hp:tedHp(L),max:tedHp(L),w:30,blk:1,r:tedR(L),dmg:tedDmg(L)+wave*6});capEnt('ted',4);break}
    case 'mine':{const n=mineN(L);for(let i=0;i<n;i++) add({k:'mine',x:cl(p.x+(i%2?-1:1)*(55+Math.floor(i/2)*48)),arm:50,r:95,dmg:mineDmg(L)+wave*4});capEnt('mine',12);break}
    case 'beartrap':{const n=trapN(L);for(let i=0;i<n;i++) add({k:'trap',x:cl(p.x+(i%2?-1:1)*(70+Math.floor(i/2)*60)),stun:trapStun(L),dmg:40+12*L});capEnt('trap',10);break}
    case 'molotov':add({k:'fire',x:cl(p.x+f*170),t:firDur(L),max:firDur(L),r:firR(L),dps:.4+.07*L});capEnt('fire',4);burst(p.x+f*100,p.y-60,'#ff8a2a',12);break;
    case 'drone':ents=ents.filter(e=>e.k!=='drone');add({k:'drone',x:p.x,y:GROUND-140,t:droneDur(L),max:droneDur(L),cd:0,L});break;
    case 'decoy':ents=ents.filter(e=>e.k!=='decoy');add({k:'decoy',x:cl(p.x+f*340),t:decDur(L),max:decDur(L)});break;
    case 'grenade':add({k:'gren',x:p.x,y:p.y-50,vx:f*6.5,vy:-8,r:grenR(L),dmg:grenDmg(L)+wave*6});break;
    case 'smoke':add({k:'smoke',x:p.x,t:smkDur(L),max:smkDur(L),r:150});capEnt('smoke',3);break;
    case 'fence':add({k:'fence',x:cl(p.x+f*115),t:fenDur(L),max:fenDur(L),w:140,dps:.5+.12*L});capEnt('fence',3);break;
    case 'dog':ents=ents.filter(e=>e.k!=='dog');add({k:'dog',x:p.x,t:dogDur(L),max:dogDur(L),cd:0,L,dir:1});break;
    case 'heli':add({k:'heli',x:p.x-f*560,dir:f,y:GROUND-250,t:heliDur(L),max:heliDur(L),cd:0,L,dmg:10+2*L+wave});break;

  }
}
const zv=z=>z.hp>0&&!(z.emerge>0)&&!z.inv&&z.fall===undefined;
const smokeAt=o=>ents.some(e=>e.k==='smoke'&&Math.abs(o.x-e.x)<e.r);
function zBlock(z,tx){for(const e of ents){if(!e.blk||e.hp<=0) continue;const rel=(e.x-z.x)*z.dir;if(rel>-6&&rel<e.w/2+10*z.size&&(e.x-tx)*z.dir<0) return e}return null}
function zSlow(z){let m=1;for(const e of ents){const d=Math.abs(z.x-e.x);if(e.k==='fence'&&d<e.w/2) m*=.6;else if(e.k==='barr'&&e.ice&&d<95) m*=.5;else if(e.k==='smoke'&&d<e.r) m*=.5}return m}
function nearestZ(x,range){let best=null,bd=range;for(const z of zombies){if(!zv(z)) continue;const d=Math.abs(z.x-x);if(d<bd){bd=d;best=z}}return best}
function updateEnts(dt){
  const p=player;
  for(const e of ents){
    if(e.t!==undefined){e.t-=dt;if(e.t<=0) e.dead=true}
    if(e.hit>0) e.hit--;
    switch(e.k){
      case 'barr':case 'ted':
        if(e.hp<=0&&!e.dead){e.dead=true;
          if(e.k==='ted'){explode(e.x,GROUND-26,e.r,e.dmg);for(let i=0;i<16;i++) particles.push({x:e.x,y:GROUND-30,vx:(Math.random()-.5)*10,vy:-3-Math.random()*7,life:55,col:i%3?'#e8a0b8':'#f4e6d0'})}
          else{burst(e.x,GROUND-24,e.ice?'#bfefff':'#9a7440',14);sfx('bhit')}}
        break;
      case 'mine':
        if(e.arm>0){e.arm--;break}
        for(const z of zombies){if(zv(z)&&Math.abs(z.x-e.x)<26){explode(e.x,GROUND-8,e.r,e.dmg);e.dead=true;break}}
        break;
      case 'trap':
        for(const z of zombies){if(zv(z)&&!z.boss&&Math.abs(z.x-e.x)<22){z.stun=e.stun;z.hp-=e.dmg;burst(z.x,GROUND-10,'#c8ccd4',8);sfx('bhit');e.dead=true;break}}
        break;
      case 'fire':
        for(const z of zombies){if(zv(z)&&Math.abs(z.x-e.x)<e.r) z.hp-=e.dps*(z.boss?.5:1)}
        if(tick%2===0) particles.push({x:e.x+(Math.random()-.5)*e.r*1.6,y:GROUND-4,vx:(Math.random()-.5)*.8,vy:-1.5-Math.random()*2,g:-.03,life:28,col:Math.random()<.5?'#ff8a2a':'#ffd45a'});
        break;
      case 'fence':
        for(const z of zombies){if(zv(z)&&Math.abs(z.x-e.x)<e.w/2) z.hp-=e.dps*(z.boss?.5:1)}
        break;
      case 'drone':{
        e.x+=(p.x-(p.face||1)*45-e.x)*.08;e.y=GROUND-140+Math.sin(tick*.08)*6;e.cd-=dt;
        if(e.cd<=0){const z=nearestZ(e.x,650);if(z){const a=Math.atan2((z.y-40*z.size)-e.y,z.x-e.x);bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*19,vy:Math.sin(a)*19,dmg:8*(1+.1*(wave-1))*(1+.12*e.L),pierce:1,life:60,hit:new Set(),col:'#9fe8ff',aoe:0,fire:false,size:2});sfx('turret');e.cd=Math.max(120,320-16*e.L)}}
        break}
      case 'dog':{
        e.cd--;const z=nearestZ(e.x,520);
        if(z){e.dir=z.x>e.x?1:-1;if(Math.abs(z.x-e.x)>26) e.x+=e.dir*4.4;else if(e.cd<=0){z.hp-=8+3*e.L;e.cd=24;burst(z.x,z.y-30,'#a22',5);sfx('hitmelee')}}
        else{const t=p.x-(p.face||1)*50;if(Math.abs(t-e.x)>10){e.dir=t>e.x?1:-1;e.x+=e.dir*3.2}}
        break}
      case 'heli':{
        e.x+=e.dir*3;e.cd--;
        if(e.cd<=0){e.cd=5;const z=nearestZ(e.x,430);if(z){z.hp-=e.dmg;e.tr={x:z.x,y:z.y-30,l:4};burst(z.x,z.y-30,'#ffd45a',3);sfx('turret')}}
        if(e.tr&&--e.tr.l<=0) e.tr=null;
        break}
      case 'gren':
        e.vy+=.45;e.x+=e.vx;e.y+=e.vy;
        if(e.y>=GROUND-6){explode(e.x,GROUND-8,e.r,e.dmg);for(const z of zombies){if(zv(z)&&!z.boss){const d=z.x-e.x;if(Math.abs(d)<e.r) z.x+=Math.sign(d||1)*45}}e.dead=true}
        break;
    }
  }
  if(fxB.magnet>0){
    const R=magR(fxL.magnet||0);
    for(const c of crates.slice()){if(c.dead||!c.landed||Math.abs(c.x-p.x)>R) continue;c.x+=Math.sign(p.x-c.x)*Math.min(5,Math.abs(p.x-c.x));if(Math.abs(c.x-p.x)<16) takeCrate(c)}
  }
  pack(ents,e=>!e.dead);
}

function endRun(){
  if(ctlEdit){player.hp=player.maxhp;return}
  if(MP.on&&MP.role==='host'){                                           // coop : un joueur à terre ne met pas fin à la partie tant qu'il en reste un debout
    const P=player;if(P.dead) return;P.dead=true;P.hp=0;
    flashG(((MP.guests.find(g=>g.p===P)||{}).name||cleanName(mpName()))+' est à terre !');
    if([MP.hostP].concat(MP.guests.map(g=>g.p)).every(q=>!q||q.dead)) MP.pendingOver=true;
    return;
  }                              // mode de personnalisation : immortel
  if(state==='over'||death) return;
  death={t:0,ph:'fall',rev:reviveAvail(),end:400};
  sfx('hurt');
}
function updateDeath(dt){
  const d=death,p=player;d.t++;
  p.vy+=GRAV;p.y+=p.vy;if(p.y>GROUND){p.y=GROUND;p.vy=0}
  for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=q.g===undefined?.3:q.g;q.life--;if(q.blood&&q.y>GROUND+4) q.life=0}
  pack(particles,q=>q.life>0);for(const f of fx) f.life--;pack(fx,f=>f.life>0);
  updateCam(false);
  if(d.ph==='fall'){
    if(d.t<60&&d.t%5===0&&d.t>6) burst(p.x,p.y-30-Math.random()*20,'#a01010',5);
    if(d.t===30) sfx('boom');
    for(const z of zombies){if(z.hp>0&&!(z.emerge>0)&&z.fall===undefined){z.dir=p.x>z.x?1:-1;if(Math.abs(z.x-p.x)>46){z.x+=z.dir*z.speed*.35;z.step+=.05}}}
    if(d.t>=140){if(d.rev){d.ph='recap';d.t=0}else{death=null;finishRun()}}
  }else if(d.ph==='recap'){
    if(d.t>=d.end){d.ph='revive';d.t=0}
  }else{
    if(d.t===1){
      const pct=bl('revive')*.1;p.hp=Math.max(1,Math.round(p.maxhp*pct));revUsed=true;p.hurtCd=0;fxB.shield=Math.max(fxB.shield,3000);fxMax.shield=Math.max(fxMax.shield||0,3000);fxL.shield=fxL.shield||0;
      for(const z of zombies){if(z.hp>0&&!z.boss&&Math.abs(z.x-p.x)<420){const dd=z.x>=p.x?1:-1;z.x+=dd*130;z.stun=70}}
      fx.push({x:p.x,y:GROUND-40,r:170,life:18});burst(p.x,p.y-40,'#ff9ac0',26);burst(p.x,p.y-40,'#ffffff',16);sfx('bonus');sfx('wave');flash('SECONDE VIE !');
    }
    if(d.t>=75) death=null;
  }
}

function mpJoin(code){

async function updCheck(manual){
  const now=Date.now();
  if(UPD.busy||(!manual&&now-UPD.lastCheck<20000)) return;
  UPD.busy=true;UPD.lastCheck=now;if(manual||UPD.status!=='avail') UPD.status='check';UPD.msg='';
  const urls=[];
  if(/^https?:$/.test(location.protocol)) urls.push({u:location.href.split('#')[0].split('?')[0],same:true});
  urls.push({u:REMOTE_URL,same:/ghoster-001\.github\.io$/.test(location.hostname)});
  let found=null;
  for(const c of urls){
    try{
      const ctl=typeof AbortController!=='undefined'?new AbortController():null,to=setTimeout(()=>ctl&&ctl.abort(),9000);
      const r=await fetch(c.u+(c.u.includes('?')?'&':'?')+'nc='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined});clearTimeout(to);
      if(!r.ok) continue;const t=await r.text(),m=t.match(/const GAME_VERSION='([0-9.]+)'/);

  }
  UPD.busy=false;
  if(!found){if(manual||UPD.status==='check'){UPD.status='err';UPD.msg=navigator.onLine===false?'hors connexion':'recherche impossible'}return}
  UPD.latest=found.v;UPD.url=found.u;UPD.same=found.same;
  if(verCmp(found.v,GAME_VERSION)>0){
    UPD.status='avail';
    if(UPD.notified!==found.v){UPD.notified=found.v;flash('MISE À JOUR DISPONIBLE : V'+found.v);try{sfx('bonus')}catch(e){}}
  } else {UPD.status='ok'}
}

function rpJoin(code){

  loadPeerJS(()=>{
    const peer=new Peer({debug:0});RMT.peer=peer;let to=0;

    peer.on('open',()=>{
      RMT.status='conn';RMT.msg='Connexion…';
      const c=peer.connect('ic02r-'+code,{serialization:'json',reliable:true});RMT.conn=c;
      to=setTimeout(()=>fail('Connexion impossible : code incorrect, joueur pas encore actif ou réseau trop restrictif'),15000);
      c.on('data',rmtData);
      c.on('open',()=>{clearTimeout(to);RMT.status='ok';RMT.lastRx=performance.now();RMT.info={};state='padmode';PADS.touches.clear();PADS.cp=0;rmtSend({t:'hello'});padSendIn(true)});
      c.on('close',()=>{clearTimeout(to);if(RMT.conn===c&&RMT.status==='ok'){RMT.status='err';RMT.msg='Connexion perdue';RMT.conn=null;if(state==='padmode') state='remote'}});
      c.on('error',()=>fail('Erreur de connexion'));
    });
    peer.on('error',e=>fail(errText(e)));
  },()=>{RMT.status='err';RMT.msg='Module de connexion introuvable (hors ligne ?)'});
}

function padChooseTap(p){
  const G=padChooseGeo(),inf=RMT.info,pages=Math.ceil(AVATARS.length/G.per),page=Math.min(PADS.cp||0,pages-1);
  const by=H-84,bh=64,l=SAFE.l,sw=Math.min(300,W*.3);
  if(p.y>=by&&p.y<=by+bh){
    if(p.x>=l+14&&p.x<=l+124){PADS.cp=(page+pages-1)%pages;return}
    if(p.x>=W-SAFE.r-144&&p.x<=W-SAFE.r-14){PADS.cp=(page+1)%pages;return}
    if(p.x>=W/2-sw/2&&p.x<=W/2+sw/2){rmtSend({t:'rdy',r:inf.rdy?0:1});return}
    return;
  }
  for(let k=0;k<G.per;k++){
    const i=page*G.per+k;if(i>=AVATARS.length) break;
    const x=G.x0+(k%G.cols)*(G.t+G.g),y=G.y0+Math.floor(k/G.cols)*(G.t+G.g);
    if(p.x>=x&&p.x<=x+G.t&&p.y>=y&&p.y<=y+G.t){rmtSend({t:'pick',av:i});try{navigator.vibrate&&navigator.vibrate(10)}catch(e){}return}
  }
}

// repères de joueurs sur l'écran partagé
function rpTags(){
  if(!MP.rp) return;
  const arr=[{p:player,i:0}].concat(MP.guests.filter(g=>g.p).map(g=>({p:g.p,i:g.id})));
  for(const e of arr){
    const p=e.p;if(p.dead) continue;const c=RP_COL[e.i]||'#fff',y=p.y-112;
    ctx.fillStyle='#0b0908';ctx.beginPath();ctx.moveTo(p.x-8,y-8);ctx.lineTo(p.x+8,y-8);ctx.lineTo(p.x,y+2);ctx.closePath();ctx.fill();

function g3Gun(P,w){                                                   // arme tenue : taille et couleur selon la famille
  if(P.gun.userData.w===w) return;P.gun.userData.w=w;while(P.gun.children.length) P.gun.remove(P.gun.children[0]);

function g3Quad(kind,col){

  const tail=g3Mesh('box',col||'#8a5a30',3,12,3,-len/2-3,hh+10,0);tail.rotation.z=.8;g.add(tail);
  if(deer){for(const z of[-3,3]){g.add(g3Mesh('cyl','#c8b890',1.4,18,1.4,len/2+4,hh+50,z*2).rotateZ(.4));g.add(g3Mesh('cyl','#c8b890',1.2,10,1.2,len/2-2,hh+57,z*3).rotateZ(-.4))}}
  for(const [x,z] of[[-len/2+5,-5],[-len/2+5,5],[len/2-5,-5],[len/2-5,5]]){const l=new T.Group();l.position.set(x,hh,z);l.add(g3Mesh('box',col||'#8a5a30',5,hh,5,0,-hh/2,0));g.add(l);P.legs.push(l)}

}
function g3Mage(){

const ZSK={normal:'#7fb069',fast:'#a9c45a',tank:'#6f8f5a',digger:'#a89478'},ZSH={normal:'#4d6a8a',fast:'#8a3f3f',tank:'#4a3a5a',digger:'#5a4636'};
function g3MakeZombie(z){
  if(z.mag){const g=g3Mage();g.userData.kind='mag';return g}
  if(z.animal){const g=g3Quad(z.animal,z.color);g.userData.kind='quad';return g}
  const sk=z.skin||ZSK[z.type]||'#7fb069',sh=z.shirt||ZSH[z.type]||'#4d6a8a';
  const g=g3Human({skin:sk,top:sh,pants:'#3d3d45',shoes:'#2a2a2a',zombie:true,big:z.type==='tank'||!!z.boss,hair:'#2f3b25',head:null});
  if(z.xm==='santa'){const P=g.userData.P;P.head.add(g3Mesh('cone','#c4161c',9.5,20,9.5,-2,16,0).rotateZ(.25))}
  else if(z.xm==='elf'){const P=g.userData.P;P.head.add(g3Mesh('cone','#2e8b3d',9.5,20,9.5,-2,16,0).rotateZ(.25))}
  g.userData.kind='hum';return g;
}
function g3Look(){const C=lookCols();return{skin:C.skin,top:C.top,pants:C.pants,shoes:C.shoes,hair:C.hair,hat:C.hat,head:C.O.head,belly:!!(C.O.belly&&C.big&&!C.f),skirt:!!(C.f&&C.O.skirt),big:C.big,female:C.f}}
function g3Frame(){
  const T=THREE;
  try{
    g3BuildWorld();
    const r=Math.min(RES,2);if(G3.W!==W||G3.H!==H||G3.R!==r){G3.W=W;G3.H=H;G3.R=r;G3.r.setSize(Math.round(W*r),Math.round(H*r),false)}
    const D=700,cx=camX+W/2,Yc=GROUND-H/2,shx=shake>.5?(Math.random()-.5)*shake:0,shy=shake>.5?(Math.random()-.5)*shake:0,cam=G3.cam;
    cam.fov=2*Math.atan(H/2/D)*180/Math.PI;cam.aspect=W/H;cam.position.set(cx-shx,Yc+shy,D);cam.lookAt(cx-shx,Yc+shy,0);cam.updateProjectionMatrix();
    // lumières
    const dark=curMap.dark||0,sunC=new T.Color('rgb('+PAL.sun+')');
    G3.hemi.color.set(PAL.sky[1]);G3.hemi.intensity=Math.max(.25,.85-dark*1.1);
    G3.sun.color.copy(sunC);G3.sun.intensity=Math.max(.2,.95-dark*1.2);G3.sun.castShadow=!!FXF.lights;
    G3.sun.position.set(cx-220,520,260);G3.sun.target.position.set(cx,0,0);G3.sun.target.updateMatrixWorld();
    let li=0;const near=G3.lamps.filter(x=>Math.abs(x-cx)<W).sort((a,b)=>Math.abs(a-cx)-Math.abs(b-cx));
    for(const l of G3.lights){const x=near[li++];if(x!==undefined&&FXF.lights){l.position.set(x+27,92,-10);l.intensity=1.4+dark*2}else l.intensity=0}
    const p=player,wp=WEAPONS[p.w],fl=(p.muz0>0||p.muz1>0)||(!wp.melee&&p.cd>wp.rate*.7);
    G3.fx=fl?1:G3.fx*.6;G3.flash.intensity=G3.fx*2.6;G3.flash.position.set(p.x+(p.face||1)*40,GROUND-p.y+50,40);
    // soleil à la même place que dans l'image 2D
    {const s=D/(D+1500),sx=W*.79-camX*.03;G3.sunSpr.position.set(cx+(sx-W/2)/s,Yc+(H/2-150)/s,-1500);G3.sunSpr.scale.set(520,520,1)}
    // entités
    const seen=new Set(),ent=G3.ent;
    const get=(o,mk)=>{let e=ent.get(o);if(!e){e=mk();e.visible=true;G3.scene.add(e);ent.set(o,e)}seen.add(o);return e};
    // joueur
    {
      const key=p, look=g3Look(),lk=JSON.stringify(look);
      let g=ent.get(key);if(g&&g.userData.lk!==lk){G3.scene.remove(g);ent.delete(key);g=null}
      g=get(key,()=>{const m=g3Human(look);m.userData.lk=lk;m.userData.kind='me';return m});
      g3Animate(g,p,true);
    }
    for(const z of zombies){
      if(Math.abs(z.x-cx)>W/2+260&&!z.boss) {const e=ent.get(z);if(e) e.visible=false;seen.add(z);continue}
      const g=get(z,()=>g3MakeZombie(z));g.visible=true;g3Zombie(g,z);
    }
    for(const [o,e] of ent) if(!seen.has(o)){G3.scene.remove(e);ent.delete(o)}
    G3.r.render(G3.scene,cam);
    G3.skip=true;
    ctx.drawImage(G3.cv,0,0,W,H);
    if(bloodSnow>0){ctx.fillStyle='rgba(120,6,14,'+(.34*bloodSnow)+')';ctx.fillRect(0,0,W,H)}
  }catch(e){
    console.error(e);G3.status='err';G3.err='erreur 3D';G3.on=false;G3.skip=false;gameMode='2D';SET.m3=false;
    return false;
  }
  return true;
}
function g3Animate(g,p,me){                                            // le joueur : jambes, visée du bras, arme
  const P=g.userData.P,face=p.face||1,Y=Math.max(0,GROUND-p.y),sw=Math.sin(p.step||0)*.7;
  g.position.set(p.x,Y,0);g.rotation.y=face>0?0:Math.PI;
  P.legL.rotation.z=sw;P.legR.rotation.z=-sw;
  let a=aimDir()?(face>0?0:Math.PI):Math.atan2(mouse.y-(p.y-48),mouse.x+camX-p.x);
  const Xd=Math.cos(a),Yd=-Math.sin(a),al=face>0?Math.atan2(Yd,Xd):Math.atan2(Yd,-Xd);
  const wp=WEAPONS[p.w];g3Gun(P,p.w);
  if(wp.melee){const sp=Math.max(0,p.swing||0)/180,ang=sp>0?(-1.2+(1-sp)*2.6):-.3;P.armR.rotation.z=ang;P.armL.rotation.z=.2}
  else{P.armR.rotation.z=al;P.armL.rotation.z=al-.15;P.armL.rotation.y=.18}
  if(!(typeof death!=='undefined'&&death)) P.body.rotation.z=0;P.head.rotation.z=Math.max(-.4,Math.min(.4,al*.2));
  g.visible=!(p.hurtCd>0&&Math.floor(p.hurtCd/60)%2);
  if(typeof death!=='undefined'&&death){const ang=deathAng();P.body.rotation.z=ang;P.body.position.y=Math.sin(ang)*12}else P.body.position.y=0;
}
function g3Zombie(g,z){
  const P=g.userData.P,k=g.userData.kind,s=z.size||1,Y=Math.max(0,GROUND-z.y);
  let sink=0;if(z.emerge>0) sink=(z.emerge/EMERGE_T)*85*s;
  if(z.mag){
    if(z.ph==='under'){g.visible=false;return}
    const low=z.ph==='sink'?(1-z.pt/50)*135:z.ph==='rise'?(z.pt/50)*135:0;
    g.position.set(z.x,Y-low*s*.5,0);g.scale.setScalar(s);g.rotation.y=z.dir>0?0:Math.PI;
    P.arm.rotation.z=.9+Math.sin((z.step||0)*.5)*.3;P.head.rotation.z=Math.sin((z.step||0)*.4)*.06;return;
  }
  g.position.set(z.x,Y-sink,0);g.rotation.y=z.dir>0?0:Math.PI;
  const sw=Math.sin(z.step||0);
  if(k==='quad'){
    g.scale.setScalar(s);const lg=P.legs;if(lg&&lg.length>3){lg[0].rotation.z=sw*.8;lg[1].rotation.z=-sw*.8;lg[2].rotation.z=-sw*.8;lg[3].rotation.z=sw*.8}
    if(P.fl){P.fl[0].rotation.x=sw*.5;P.fl[1].rotation.x=-sw*.5}
    return;
  }
  g.scale.setScalar(s*(z.boss?1:1));
  P.legL.rotation.z=sw*.6;P.legR.rotation.z=-sw*.6;
  const lean=z.type==='fast'?.22:.06;P.body.rotation.z=-lean;
  P.armL.rotation.z=.12+Math.sin((z.step||0)+1)*.12;P.armR.rotation.z=.18+Math.sin((z.step||0))*.12;
  g.userData.hit=z.stun>0;
}
// --- branchement sur le dessin 2D : le décor 2D est remplacé par la scène 3D ; les personnages 2D ne sont plus dessinés ---
const _bg3=drawBackground,_dz3=drawZombie,_de3=drawEmerge,_ds3=drawSoldier,_fog3=drawFog,_ash3=ash;
drawBackground=function(){if(G3.on){if(g3Frame()) return}return _bg3.apply(this,arguments)};
drawZombie=function(z){if(G3.skip) return;return _dz3(z)};
drawEmerge=function(z){if(G3.skip) return;return _de3(z)};
drawSoldier=function(p){if(G3.skip) return;return _ds3(p)};
drawFog=function(front){if(front) G3.skip=false;if(G3.on) return;return _fog3.apply(this,arguments)};
ash=function(){if(G3.on) return;return _ash3()};

if(SET.m3){gameMode='3D';g3Request()}
// --- Boucle ---
for(const ev of['mousemove','mousedown','mouseup','touchstart','touchmove','keydown','wheel']) addEventListener(ev,()=>{uiDirty=true},{passive:true});
let last=performance.now();
let emaDt=16.7,adaptT=0;
const STEP=1000/60;let acc=0,lastDrawT=0,drawDebt=0,acT=0;
function loop(t){
  const dtRaw=Math.max(0,t-last);last=t;hzSample(dtRaw);
  const dtc=Math.min(100,dtRaw);acc+=dtc;adaptT+=dtc;drawDebt=Math.min(500,drawDebt+dtc);
  fxUpdate();ATK=FXF.anim===0?0:tick;
  inputFrame(Math.min(3,dtc/16.7));rmtTick(t);mpTick(t);
  if(t-acT>3000){acT=t;ACG.codeCheck();ACG.clockCheck()}
  const iv=1000/FXF.fps,interp=FXF.fps>61;
  if(state!=='play'||paused) prevValid=false;
  // la logique tourne à 60 Hz fixes (même vitesse de jeu quel que soit l'écran) ; au-dessus de 60 FPS les positions sont interpolées
  let steps=0;
  while(acc>=STEP-2&&steps<4){acc-=STEP;steps++;tick++;if(interp&&state==='play'&&!paused) snapPrev();try{update(STEP)}catch(e){console.error(e)}ACG.watch()}
  if(steps>=4) acc=0;else if(acc<-STEP/2) acc=0;
  const menuOnly=FXF.anim===0&&MENU_STATES.includes(state)&&state!=='pause'&&state!=='over'&&!(state==='wheel'&&wheel.spin);
  if(state!==lastUiState){if(state==='menu') updCheck(false);lastUiState=state;uiDirty=true}
  if(state==='menu'&&window.__updNotice){const n=window.__updNotice;window.__updNotice=null;flash('MISE À JOUR INSTALLÉE : V'+n[0]+' → V'+n[1]+' · progression conservée')}
  const skipMenu=menuOnly&&!uiDirty&&t-lastDrawT<250;                  // animations coupées : les menus ne se redessinent qu'au besoin
  if(drawDebt>=iv-1&&(steps>0||interp)&&!skipMenu){
    uiDirty=false;
    drawDebt=Math.max(0,drawDebt-iv);
    const d=t-lastDrawT;if(lastDrawT>0&&d<200){ftPush(d);emaDt+=(d-emaDt)*.05}lastDrawT=t;fcUpdate(t);
    const useI=interp&&prevValid,al=Math.max(0,Math.min(1,acc/STEP));
    if(useI) interpOn(al);
    try{draw()}catch(e){console.error(e)}
    if(useI) interpOff();
    try{drawFps()}catch(e){console.error(e)}
  }
  if(adaptT>3000&&!document.hidden){
    adaptT=0;
    if(emaDt>(1000/Math.min(FXF.fps,60))*1.55){                    // le jeu rame : d'abord la résolution, puis les effets (profil AUTO)
      if((SET.gfx||'auto')==='auto'&&RES>1){autoCap=Math.max(1,RES-.5);fit()}
      else if(SET.prof==='auto'&&autoDrop<6) autoDrop++;
    }
  }
  requestAnimationFrame(loop);
}
ACG.check(save);ACG.snapFns();
applyMap();reset(true);

if(document.fonts){document.fonts.load('700 20px Oswald');document.fonts.load('400 20px "Black Ops One"')}
