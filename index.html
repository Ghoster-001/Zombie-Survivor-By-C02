function keyName(c){
  if(!c) return '—';
  const m={Space:'ESPACE',ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',ShiftLeft:'MAJ G',ShiftRight:'MAJ D',ControlLeft:'CTRL G',ControlRight:'CTRL D',AltLeft:'ALT G',AltRight:'ALT D',Enter:'ENTRÉE',Tab:'TAB',Backspace:'RETOUR',Semicolon:';',Comma:',',Period:'.',Slash:'/',Backslash:'\\',Quote:"'",Minus:'-',Equal:'='};
  if(m[c]) return m[c];
  if(/^Key[A-Z]$/.test(c)) return c.slice(3);
  if(/^Digit\d$/.test(c)) return c.slice(5);
  if(/^Numpad/.test(c)) return 'PAVÉ '+c.slice(6);

}

}

// Barre de niveau animée : remplissage, reflet qui défile, étincelle au bout, halo à chaque niveau gagné
function drawXpBar(x,y,w,h,xpVal,pulse){
  const L=levelOf(xpVal),a=xpForLevel(L),b=xpForLevel(L+1),f=Math.max(0,Math.min(1,(xpVal-a)/(b-a)));
  panel(x-3,y-3,w+6,h+6,{norivets:true,grunge:.6,top:'#1a1512',bot:'#0e0b09'});
  ctx.fillStyle='#120e0b';ctx.fillRect(x,y,w,h);
  if(pulse>0){ctx.shadowColor='#ffd45a';ctx.shadowBlur=18*pulse/45}
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#ffd86a');g.addColorStop(1,'#c98a1a');
  ctx.fillStyle=g;ctx.fillRect(x,y,w*f,h);ctx.shadowBlur=0;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w*f,h);ctx.clip();
  const sx=x+((tick*3)%(w+80))-60,sg=ctx.createLinearGradient(sx,0,sx+50,0);
  sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.55)');sg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(sx,y,50,h);ctx.restore();
  ctx.fillStyle='#00000040';for(let i=1;i<10;i++) ctx.fillRect(x+w*i/10,y,1,h);
  if(f>0&&f<1){ctx.fillStyle='#fff';ctx.globalAlpha=.6+.4*Math.sin(tick*.3);ctx.beginPath();ctx.arc(x+w*f,y+h/2,h*.45,0,7);ctx.fill();ctx.globalAlpha=1}
  ctx.strokeStyle='#5a4a30';ctx.lineWidth=1.5;ctx.strokeRect(x,y,w,h);
  return {L,a,b};
}

function startWave(){
  wave++; state='play'; waveBreak=0;
  const n=5+wave*3; spawnQueue=[];
  const pf=Math.min(.4,.12+.03*wave), pt=Math.min(.25,.04+.025*wave);
  for(let i=0;i<n;i++){
    let t='normal', r=Math.random();
    if(wave>=2 && r<pf) t='fast';
    else if(wave>=3 && r>1-pt) t='tank';
    spawnQueue.push(t);
  }
  spawnTimer=60; flash('Vague '+wave);
}

const ownedGuns=()=>WEAPONS.map((w,i)=>i).filter(i=>!WEAPONS[i].melee&&isOwned(i));
function spawnCrate(){

  crates.push({x:70+Math.random()*(W-140),y:-30,vy:0,landed:false,age:0,ph:Math.random()*6,
    w:pool[Math.floor(Math.random()*pool.length)],

function updateCrates(dt,p){

// --- Sons : synthétisés en direct (WebAudio), un son propre à chaque famille d'arme, décliné par arme ---
let AC=null,AMASTER=null,AVERB=null,ANOISE=null;const lastSfx={};
function audioBuild(c){
  AC=c;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
  AMASTER=c.createGain();AMASTER.gain.value=.55*SET.vol;AMASTER.connect(comp);comp.connect(c.destination);
  const n=c.sampleRate*2;ANOISE=c.createBuffer(1,n,c.sampleRate);const d=ANOISE.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const L=Math.floor(c.sampleRate*1.3),ir=c.createBuffer(2,L,c.sampleRate);
  for(let ch=0;ch<2;ch++){const dd=ir.getChannelData(ch);for(let i=0;i<L;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2)}
  AVERB=c.createConvolver();AVERB.buffer=ir;const vg=c.createGain();vg.gain.value=.5;AVERB.connect(vg);vg.connect(AMASTER);
}
function audioInit(){
  if(AC){if(AC.state==='suspended'&&AC.resume) AC.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C) return;
  try{audioBuild(new C())}catch(e){AC=null}
}
function setVol(){if(AMASTER) AMASTER.gain.value=.55*SET.vol}
const snd=()=>AC&&SET.vol>0;
function env(g,t,dur,vol,att){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+(att||.002));g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function nz(t,dur,o){                                  // rafale de bruit filtré (souffle, détonation, impact)
  o=o||{};const s=AC.createBufferSource();s.buffer=ANOISE;
  const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||.8;f.frequency.setValueAtTime(o.f||1000,t);
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t+dur);
  const g=AC.createGain();env(g,t,dur,o.vol==null?1:o.vol,o.att);
  s.connect(f);f.connect(g);g.connect(AMASTER);
  if(o.rev){const r=AC.createGain();r.gain.value=o.rev;g.connect(r);r.connect(AVERB)}
  s.start(t,Math.random()*.6);s.stop(t+dur+.05);
}
function tone(t,dur,o){                                // oscillateur (corps grave, corde, laser, voix)
  o=o||{};const s=AC.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(o.f||100,t);
  if(o.f2) s.frequency.exponentialRampToValueAtTime(Math.max(15,o.f2),t+dur);
  const g=AC.createGain();env(g,t,dur,o.vol==null?1:o.vol,o.att);
  let out=s;if(o.lp){const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;s.connect(f);out=f}
  out.connect(g);g.connect(AMASTER);
  if(o.rev){const r=AC.createGain();r.gain.value=o.rev;g.connect(r);r.connect(AVERB)}
  s.start(t);s.stop(t+dur+.05);
}
const wHash=n=>{let h=7;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return (h%1000)/1000};

  // déplacement
  let mv=(kd('right')?1:0)-(kd('left')?1:0);
  p.x+=mv*4; p.x=Math.max(20,Math.min(W-20,p.x));
  if(mv) p.step+=0.25*Math.abs(mv);
  if(kd('jump') && p.y>=GROUND) p.vy=-13;
  p.vy+=GRAV; p.y+=p.vy; if(p.y>GROUND){p.y=GROUND;p.vy=0}
  if(SET.aim==='dir'){ if(mv) p.dir=mv>0?1:-1; p.face=p.dir||1 }          // visée « direction » : on tire dans le sens du déplacement
  else p.face=mouse.x>=p.x?1:-1;
  // tir
  p.cd-=dt; p.hurtCd-=dt; p.swing-=dt;
  const wp=WEAPONS[p.w];
  const firing=mouse.down||kd('fire');
  if(firing && p.cd<=0 && (wp.auto || !p.held)){ if(wp.melee) slash(); else {shoot();useAmmo()} }
  updateCrates(dt,p);
  p.held=firing;
  // apparition
  spawnTimer-=1;
  if(spawnQueue.length && spawnTimer<=0){
    spawnZombie(spawnQueue.pop());
    spawnTimer=Math.max(25,80-wave*4);
  }
  // balles
  for(const b of bullets){
    b.x+=b.vx;b.y+=b.vy;b.life--;
    for(const z of zombies){
      if(b.hit.has(z)||z.hp<=0) continue;
      const zh=70*z.size;
      if(Math.abs(b.x-z.x)<14*z.size && b.y<z.y && b.y>z.y-zh){
        if(b.aoe){explode(b.x,b.y,b.aoe,b.dmg);b.life=0;break}
        z.hp-=b.dmg; b.hit.add(z); b.pierce--; burst(b.x,b.y,'#a22',5);sfx('bhit');
        z.x+=Math.sign(b.vx)*3;
        if(b.pierce<=0){b.life=0;break}
      }
    }
  }
  for(const b of bullets) if(b.aoe&&b.life>0&&b.y>GROUND){explode(b.x,GROUND,b.aoe,b.dmg);b.life=0}
  bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y<GROUND+30);
  // zombies
  for(const z of zombies){
    if(z.hp<=0){onKill(z);continue}
    z.dir=p.x>z.x?1:-1;
    z.x+=z.dir*z.speed; z.step+=0.15*z.speed;
    if(Math.abs(z.x-p.x)<18*z.size && p.y>GROUND-60 && p.hurtCd<=0){
      p.hp-=z.dmg; p.hurtCd=500;sfx('hurt'); if(SET.shake) shake=8; burst(p.x,p.y-40,'#d33',10);
      if(p.hp<=0){p.hp=0;endRun()}
    }
  }
  zombies=zombies.filter(z=>z.hp>0);
  // fin de vague
  if(state==='play' && !spawnQueue.length && !zombies.length){
    if(waveBreak===0){waveBreak=150;money+=5;runXp+=5;sfx('wave');flash('Vague '+wave+' terminée  ·  +5 $  +5 XP')}
    else if(--waveBreak===0) startWave();
  }
  for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.3;q.life--}
  particles=particles.filter(q=>q.life>0);
  for(const f of fx) f.life--; fx=fx.filter(f=>f.life>0);
  if(msgT>0) msgT--;
  comboT-=dt; if(comboT<=0) combo=0;
}

  burst(z.x,z.y-30,SET.blood?'#8e1b1b':z.color,SET.blood?20:10);
}

function makeTextures(){

    rg.addColorStop(0,rnd()<.6?'rgba(120,52,18,.22)':'rgba(0,0,0,.3)');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2)}

}

  const list=[];WEAPONS.forEach((w,i)=>{if(w.cat===CAT[upCat]) list.push(i)});
  list.sort((p,q)=>WEAPONS[p].lvl-WEAPONS[q].lvl||p-q);
  const pages=Math.max(1,Math.ceil(list.length/5)); if(upPage>=pages) upPage=0;
  const cw=168,gap=10,x0=40;
  for(let k=0;k<5;k++){const idx=list[upPage*5+k]; if(idx!==undefined) weaponCard(idx,x0+k*(cw+gap),122,cw,200)}
  ctx.fillStyle='#8a8178';ctx.font='500 14px '+FONT;
  ctx.fillText('PAGE '+(upPage+1)+' / '+pages+'   ·   '+list.length+' ARMES   ·   '+(upCat===0?'clique sur une arme possédée : améliorer, couleur, équiper':'armes à feu : une fois débloquées, elles tombent dans les caisses'),40,344);
  if(pages>1){
    btn(menuRects,W-300,328,120,24,'<  PRÉC.',{act:()=>upPage=(upPage+pages-1)%pages,size:14});
    btn(menuRects,W-170,328,130,24,'SUIV.  >',{act:()=>upPage=(upPage+1)%pages,size:14});
  }
  ctx.fillStyle='#8a8178';ctx.font='500 15px '+FONT;ctx.fillText('PERSONNAGE  ·  la vitesse de déplacement ne s\'améliore pas',40,378);
  const hpMax=save.hpLvl>=MAX_UP;
  btn(menuRects,40,386,430,54,'VIE MAX  +20',{act:buyHp,sub:hpMax?'NIVEAU MAX':'NIV. '+save.hpLvl+'  ·  '+(100+20*save.hpLvl)+' PV  ·  $'+hpCost(),dim:hpMax,size:20});
  btn(menuRects,40,462,200,46,'RETOUR',{act:()=>reset(true)});
  ctx.fillStyle='#8a8178';ctx.font='500 14px '+FONT;
  ctx.fillText('Les améliorations se font uniquement ici, entre deux parties. Le niveau monte en tuant des zombies.',260,490);
  if(msgT>0){msgT--;ctx.fillStyle='#e2542e';ctx.font='700 20px '+FONT;ctx.fillText(msg.toUpperCase(),260,516)}
}

// --- Boucle ---
let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
reset(true);
makeTextures();
if(document.fonts){document.fonts.load('700 20px Oswald');document.fonts.load('400 20px "Black Ops One"')}
requestAnimationFrame(loop);
</script>
